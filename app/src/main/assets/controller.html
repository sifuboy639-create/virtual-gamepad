<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Virtual Gamepad</title><style>
:root{--bg:#14161c;--p:#1b1e26;--e:#2a2e39;--w:#0e1015;--a:#e8a33d;--s:#45c4b0;--t:#eceae4;--d:#838791;--ok:#5fbf77;--bad:#d9534f}*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--t);font-family:system-ui,Roboto,Arial,sans-serif}button{font:inherit;color:inherit}.app{height:100%;display:flex;flex-direction:column;padding:10px 12px 12px}.top{height:40px;display:flex;align-items:center;justify-content:space-between;gap:10px}.status{display:flex;align-items:center;gap:8px;color:var(--d);font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:var(--bad)}.connected .dot{background:var(--ok)}.connecting .dot{background:var(--a)}.mid{display:flex;gap:8px}.pill,.gear,.btn{border:1px solid var(--e);background:var(--p);border-radius:12px}.pill{padding:6px 13px;font-size:11px}.gear{width:34px;height:34px}.pad{flex:1;display:flex;align-items:stretch;justify-content:space-between;gap:10px}.side{width:40%;display:flex;flex-direction:column;justify-content:space-between}.shoulders{display:flex;gap:10px;align-items:center}.shoulders.r{flex-direction:row-reverse}.bumper{width:64px;height:36px;border-radius:10px;border:1px solid var(--e);background:linear-gradient(#292e39,#1a1d24);font-weight:700;font-size:12px}.trigger{width:32px;height:72px;border:1px solid var(--e);border-radius:10px;background:var(--w);position:relative;overflow:hidden}.fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#45c4b0,#e8a33d)}.lab{position:absolute;top:4px;width:100%;text-align:center;font-size:10px;color:var(--d)}.row{display:flex;align-items:center;justify-content:space-between;gap:16px}.stick{width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#292e39,var(--w) 70%);border:1px solid var(--e);position:relative}.nub{width:52px;height:52px;border-radius:50%;background:linear-gradient(#3b414e,#22262e);border:1px solid #4a5060;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}.stick.on .nub{border-color:var(--s);box-shadow:0 0 0 3px rgba(69,196,176,.18)}.click{min-width:42px;height:24px;border-radius:7px;border:1px solid var(--e);background:var(--p);font-size:10px;font-weight:800}.on{color:var(--a)!important;border-color:var(--a)!important;box-shadow:0 0 0 2px rgba(232,163,61,.14) inset}.dpad{width:124px;height:124px;position:relative;align-self:flex-start;margin-bottom:4px}.dpad button{position:absolute;width:42px;height:42px;border:1px solid var(--e);background:linear-gradient(#292e39,#1a1d24);font-size:14px}.up{left:41px;top:0;border-radius:9px 9px 0 0}.down{left:41px;bottom:0;border-radius:0 0 9px 9px}.left{left:0;top:41px;border-radius:9px 0 0 9px}.right{right:0;top:41px;border-radius:0 9px 9px 0}.faces{width:138px;height:138px;position:relative;align-self:flex-end}.faces button{position:absolute;width:48px;height:48px;border-radius:50%;border:1px solid var(--e);background:linear-gradient(#292e39,#1a1d24);font-weight:800}.Y{left:45px;top:0}.A{left:45px;bottom:0}.X{left:0;top:45px}.B{right:0;top:45px}.hint{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);color:#777b84;font-size:10px;pointer-events:none}@media(max-height:430px){.stick{width:92px;height:92px}.nub{width:44px;height:44px}.faces{width:112px;height:112px}.faces button{width:40px;height:40px}.Y,.A{left:36px}.X,.B{top:36px}.dpad{width:100px;height:100px}.dpad button{width:34px;height:34px}.up,.down{left:33px}.left,.right{top:33px}}
</style></head><body><div class="app"><div class="top"><div id="status" class="status"><i class="dot"></i><span id="st">Disconnected</span></div><div class="mid"><button class="pill" data-bit="16" id="start">Start</button><button class="pill" data-bit="32" id="back">Back</button></div><button class="gear" id="gear">⚙</button></div><div class="pad"><section class="side"><div class="shoulders"><button class="bumper" data-bit="256">LB</button><div class="trigger" id="lt"><div class="fill"></div><div class="lab">LT</div></div></div><div class="row"><div><div class="stick" id="sl"><div class="nub"></div></div><button class="click" data-bit="64">L3</button></div><div class="dpad"><button class="up" data-bit="1">▲</button><button class="down" data-bit="2">▼</button><button class="left" data-bit="4">◀</button><button class="right" data-bit="8">▶</button></div></div></section><section class="side"><div class="shoulders r"><button class="bumper" data-bit="512">RB</button><div class="trigger" id="rt"><div class="fill"></div><div class="lab">RT</div></div></div><div class="row"><div class="faces"><button class="Y" data-bit="32768">Y</button><button class="A" data-bit="4096">A</button><button class="X" data-bit="16384">X</button><button class="B" data-bit="8192">B</button></div><div><div class="stick" id="sr"><div class="nub"></div></div><button class="click" data-bit="128">R3</button></div></div></section></div><div class="hint">Landscape touch controller</div></div><script>
const S={b:0,lx:0,ly:0,rx:0,ry:0,lt:0,rt:0};let mode='';function bridge(){if(window.AndroidBT)mode='AndroidBT';else if(window.AndroidTV)mode='AndroidTV';return window[mode]}function send(){const b=bridge();if(b?.onState)b.onState(JSON.stringify(S))}function setBit(bit,on){if(on)S.b|=bit;else S.b&=~bit;send()}function bindButton(el){const bit=+el.dataset.bit;const down=e=>{e.preventDefault();el.classList.add('on');setBit(bit,true)};const up=e=>{e.preventDefault();el.classList.remove('on');setBit(bit,false)};el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',e=>{if(e.buttons)up(e)})}document.querySelectorAll('[data-bit]').forEach(bindButton);
function stick(id,xk,yk){const el=document.getElementById(id),nub=el.querySelector('.nub');let pid=null;const update=e=>{const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.43;let x=e.clientX-cx,y=e.clientY-cy,m=Math.hypot(x,y);if(m>max){x=x*max/m;y=y*max/m}const nx=x/max,ny=y/max;nub.style.left='calc(50% + '+nx*38+'%)';nub.style.top='calc(50% + '+ny*38+'%)';S[xk]=+nx.toFixed(3);S[yk]=+ny.toFixed(3);send()};const end=()=>{if(pid!==null){pid=null;el.classList.remove('on');nub.style.left='50%';nub.style.top='50%';S[xk]=0;S[yk]=0;send()}};el.addEventListener('pointerdown',e=>{pid=e.pointerId;el.setPointerCapture(pid);el.classList.add('on');update(e)});el.addEventListener('pointermove',e=>{if(e.pointerId===pid)update(e)});el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}stick('sl','lx','ly');stick('sr','rx','ry');
function trigger(id,key){const el=document.getElementById(id),fill=el.querySelector('.fill');let pid=null;const update=e=>{const r=el.getBoundingClientRect(),v=Math.max(0,Math.min(1,(r.bottom-e.clientY)/r.height));S[key]=+v.toFixed(3);fill.style.height=v*100+'%';send()};const end=()=>{pid=null;S[key]=0;fill.style.height='0%';send()};el.addEventListener('pointerdown',e=>{pid=e.pointerId;el.setPointerCapture(pid);update(e)});el.addEventListener('pointermove',e=>{if(e.pointerId===pid)update(e)});el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}trigger('lt','lt');trigger('rt','rt');
window.__onNativeStatus=(txt,cls)=>{document.getElementById('st').textContent=txt;document.getElementById('status').className='status '+(cls||'')};document.getElementById('gear').onclick=()=>alert('Virtual Gamepad\nBluetooth mode pairs directly with a compatible host. TV mode requires this app enabled as an input method on the Android TV / Google TV.');send();
</script></body></html>
