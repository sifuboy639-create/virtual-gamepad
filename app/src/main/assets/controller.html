<title>vz-hub</title>
<style>
:root{--bg:#14161c;--panel:#1b1e26;--edge:#2a2e39;--well:#0e1015;--accent:#e8a33d;--stick:#45c4b0;--text:#eceae4;--dim:#838791;--ok:#5fbf77;--bad:#d9534f}
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,Roboto,Arial,sans-serif}
button,select,input{font:inherit;color:inherit}.app{height:100%;display:flex;flex-direction:column;padding:10px 12px 12px}.top{height:42px;display:flex;align-items:center;justify-content:space-between;gap:8px}.status{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12px;min-width:115px}.dot{width:9px;height:9px;border-radius:50%;background:var(--bad)}.status.connected .dot{background:var(--ok)}.status.connecting .dot{background:var(--accent)}.mid{display:flex;gap:7px;align-items:center;justify-content:center}.pill,.gear{border:1px solid var(--edge);background:var(--panel);border-radius:12px}.pill{padding:6px 10px;font-size:11px}.pill.active{border-color:var(--accent);color:var(--accent)}.gear{width:34px;height:34px}.pad{flex:1;display:flex;justify-content:space-between;gap:12px}.side{width:40%;display:flex;flex-direction:column;justify-content:space-between;min-width:0}.shoulders{display:flex;gap:9px;align-items:center}.rightShoulders{flex-direction:row-reverse}.bumper{width:62px;height:35px;border-radius:10px;border:1px solid var(--edge);background:linear-gradient(#292e39,#1a1d24);font-weight:700;font-size:12px}.trigger{width:31px;height:72px;border:1px solid var(--edge);border-radius:10px;background:var(--well);position:relative;overflow:hidden}.fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(var(--stick),var(--accent))}.lab{position:absolute;top:4px;left:0;right:0;text-align:center;font-size:9px;color:var(--dim)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stickWrap{display:flex;flex-direction:column;align-items:center;gap:5px}.stick{width:106px;height:106px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#292e39,var(--well) 70%);border:1px solid var(--edge);position:relative}.nub{width:50px;height:50px;border-radius:50%;background:linear-gradient(#3b414e,#22262e);border:1px solid #4a5060;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}.stick.active .nub{border-color:var(--stick);box-shadow:0 0 0 3px rgba(69,196,176,.18)}.click{min-width:38px;height:20px;border-radius:7px;border:1px solid var(--edge);background:var(--panel);font-size:9px;font-weight:800}.dpad{width:120px;height:120px;position:relative}.dpad button{position:absolute;width:40px;height:40px;border:1px solid var(--edge);background:linear-gradient(#292e39,#1a1d24);font-size:14px}.up{left:40px;top:0;border-radius:9px 9px 0 0}.down{left:40px;bottom:0;border-radius:0 0 9px 9px}.left{left:0;top:40px;border-radius:9px 0 0 9px}.right{right:0;top:40px;border-radius:0 9px 9px 0}.faces{width:130px;height:130px;position:relative}.faces button{position:absolute;width:45px;height:45px;border-radius:50%;border:1px solid var(--edge);background:linear-gradient(#292e39,#1a1d24);font-weight:800}.faces .Y{left:42px;top:0}.faces .A{left:42px;bottom:0}.faces .X{left:0;top:42px}.faces .B{right:0;top:42px}.on{color:var(--accent)!important;border-color:var(--accent)!important;box-shadow:0 0 0 3px rgba(232,163,61,.16) inset}.hint{position:fixed;left:50%;bottom:4px;transform:translateX(-50%);font-size:9px;color:#777b84;pointer-events:none}.modal{display:none;position:fixed;inset:0;z-index:500;background:rgba(8,10,14,.88);align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.card{width:min(92vw,400px);background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.4)}.card h2{font-size:16px;margin:0 0 12px}.fieldRow{display:grid;grid-template-columns:1fr 95px;gap:9px}.field label{display:block;color:var(--dim);font-size:11px;margin-bottom:5px}.field input,.field select{width:100%;background:var(--well);border:1px solid var(--edge);border-radius:10px;padding:9px}.actions{display:flex;gap:9px;margin-top:12px}.actions button{flex:1;border-radius:10px;padding:10px;border:1px solid var(--edge);background:transparent}.actions .primary{background:var(--accent);color:#201202;border-color:var(--accent);font-weight:700}.err{min-height:15px;color:var(--bad);font-size:11px;margin-top:7px}.small{font-size:10px;line-height:1.5;color:var(--dim);margin-top:8px}#custom-panel .card{width:min(94vw,640px)}.customHead{display:flex;justify-content:space-between;gap:10px;align-items:center}.customHead span{display:block;color:var(--dim);font-size:10px;margin-top:2px}.customGrid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:9px;margin-top:11px}.customGrid label{font-size:10px;color:var(--dim);display:flex;flex-direction:column;gap:5px}.customGrid select,.customGrid input{background:var(--well);border:1px solid var(--edge);border-radius:9px;padding:8px}.customGrid output{text-align:right;margin-top:-26px;margin-right:8px;color:var(--text);font-size:11px}.customActions{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:10px}.customActions button{border:1px solid var(--edge);background:transparent;border-radius:9px;padding:7px 10px}.customActions .primary{background:var(--accent);color:#201202;border-color:var(--accent);font-weight:700}.layoutTarget{transform-origin:center center!important}.customizing .layoutTarget{outline:1px dashed rgba(232,163,61,.7);outline-offset:4px}.customizing .layoutTarget.selected{outline:2px solid var(--accent);outline-offset:5px;box-shadow:0 0 0 4px rgba(232,163,61,.15)!important}.customizing .layoutTarget *{pointer-events:none!important}.splash{position:fixed;inset:0;z-index:1000;background:#07101a;display:flex;align-items:center;justify-content:center;opacity:1;transition:opacity .45s}.splash.hide{opacity:0;pointer-events:none}.splash img{width:100%;height:100%;object-fit:cover}
@media(max-height:430px){.stick{width:92px;height:92px}.dpad{width:100px;height:100px}.dpad button{width:34px;height:34px}.up,.down{left:33px}.left,.right{top:33px}.faces{width:112px;height:112px}.faces button{width:40px;height:40px}.faces .Y,.faces .A{left:36px}.faces .X,.faces .B{top:36px}.customGrid{grid-template-columns:1fr 1fr}.customGrid label:last-child{grid-column:1/-1}}

/* PS Remote Play-inspired floating touch controls */
html,body{background:#000}
.app{padding:0;position:relative;background:transparent}
.top{position:fixed;inset:10px 12px auto 12px;height:44px;z-index:80;pointer-events:none}
.top>*{pointer-events:auto}
.status{padding:7px 10px;border-radius:14px;background:rgba(0,0,0,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#eee}
.mid{position:absolute;left:50%;transform:translateX(-50%);gap:10px}
.pill{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff}
#btn-customize{display:none}
.gear{position:fixed;left:18px;bottom:18px;width:42px;height:42px;border-radius:50%;z-index:90;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pad{position:absolute;inset:0;display:block}
.side{position:static;width:auto;display:block;min-width:0}
.shoulders{position:absolute;top:34px;display:flex;align-items:center;gap:12px;z-index:40}
.side:first-child .shoulders{left:3.5%}
.side:last-child .shoulders{right:3.5%}
.rightShoulders{flex-direction:row-reverse}
.bumper{width:82px;height:46px;border-radius:18px;background:rgba(10,14,22,.34);border:2px solid rgba(220,230,245,.24);box-shadow:inset 0 0 12px rgba(255,255,255,.08),0 5px 16px rgba(0,0,0,.28);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);font-size:15px;color:#e8edf5}
.trigger{width:68px;height:106px;border-radius:24px;background:rgba(10,14,22,.3);border:2px solid rgba(220,230,245,.24);box-shadow:inset 0 0 16px rgba(255,255,255,.08),0 6px 18px rgba(0,0,0,.3);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);transform:rotate(-23deg)}
.rightShoulders .trigger{transform:rotate(23deg)}
.trigger .lab{font-size:14px;color:#e8edf5;top:10px}
.fill{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(90,180,255,.35))}
.row{position:static}
.side:first-child .row{display:block}
.side:last-child .row{display:block}
.stickWrap{position:absolute;z-index:30}
.side:first-child .stickWrap{left:21%;bottom:15%}
.side:last-child .stickWrap{right:21%;bottom:15%}
.stick{width:118px;height:118px;background:radial-gradient(circle at 35% 30%,rgba(90,100,115,.42),rgba(5,8,13,.34) 72%);border:2px solid rgba(220,230,245,.22);box-shadow:inset 0 0 20px rgba(255,255,255,.06),0 7px 20px rgba(0,0,0,.28);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.nub{width:54px;height:54px;background:rgba(35,42,53,.7);border:2px solid rgba(225,235,248,.25);box-shadow:0 3px 10px rgba(0,0,0,.35)}
.click{margin-top:8px;background:rgba(0,0,0,.3);border-color:rgba(255,255,255,.22);color:#fff}
.dpad{position:absolute;left:5%;bottom:11%;width:150px;height:150px;z-index:30}
.dpad button{width:54px;height:54px;background:rgba(20,24,32,.34);border:2px solid rgba(220,230,245,.2);box-shadow:inset 0 0 12px rgba(255,255,255,.06);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);color:#e8edf5;font-size:18px}
.up,.down{left:48px}.left,.right{top:48px}
.up{border-radius:17px 17px 7px 7px}.down{border-radius:7px 7px 17px 17px}.left{border-radius:17px 7px 7px 17px}.right{border-radius:7px 17px 17px 7px}
.faces{position:absolute;right:5%;bottom:11%;width:160px;height:160px;z-index:30}
.faces button{width:58px;height:58px;background:rgba(20,24,32,.34);border:2px solid rgba(220,230,245,.2);box-shadow:inset 0 0 12px rgba(255,255,255,.06);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);color:#e8edf5;font-size:18px}
.faces .Y,.faces .A{left:51px}.faces .X,.faces .B{top:51px}
.btn-back,.btn-start{background:rgba(0,0,0,.28)}
.hint{bottom:8px;background:rgba(0,0,0,.25);padding:4px 8px;border-radius:8px}
.customizing .layoutTarget{outline:2px dashed rgba(255,255,255,.7);outline-offset:5px}
@media(max-height:430px){
 .shoulders{top:25px}.bumper{width:68px;height:38px}.trigger{width:54px;height:82px}
 .stick{width:92px;height:92px}.side:first-child .stickWrap{left:19%;bottom:13%}.side:last-child .stickWrap{right:19%;bottom:13%}
 .dpad{width:120px;height:120px;left:4%;bottom:9%}.dpad button{width:43px;height:43px}.up,.down{left:38px}.left,.right{top:38px}
 .faces{width:130px;height:130px;right:4%;bottom:9%}.faces button{width:47px;height:47px}.faces .Y,.faces .A{left:41px}.faces .X,.faces .B{top:41px}
}
</style>
</head>

      <div class="shoulders"><button class="bumper" id="btn-lb" data-control="btn-lb">LB</button><div class="trigger" id="lt-track" data-control="lt-track"><div class="fill" id="lt-fill"></div><div class="lab">LT</div></div></div>
      <div class="row"><div class="stickWrap"><div class="stick" id="stick-l" data-control="stick-l"><div class="nub"></div></div><button class="click" id="btn-l3" data-control="btn-l3">L3</button></div><div class="dpad"><button class="up" id="dpad-up" data-control="dpad-up">▲</button><button class="down" id="dpad-down" data-control="dpad-down">▼</button><button class="left" id="dpad-left" data-control="dpad-left">◀</button><button class="right" id="dpad-right" data-control="dpad-right">▶</button></div></div>
    </section>
    <section class="side">
      <div class="shoulders rightShoulders"><button class="bumper" id="btn-rb" data-control="btn-rb">RB</button><div class="trigger" id="rt-track" data-control="rt-track"><div class="fill" id="rt-fill"></div><div class="lab">RT</div></div></div>
      <div class="row"><div class="faces"><button class="Y" id="btn-y" data-control="btn-y">Y</button><button class="A" id="btn-a" data-control="btn-a">A</button><button class="X" id="btn-x" data-control="btn-x">X</button><button class="B" id="btn-b" data-control="btn-b">B</button></div><div class="stickWrap"><div class="stick" id="stick-r" data-control="stick-r"><div class="nub"></div></div><button class="click" id="btn-r3" data-control="btn-r3">R3</button></div></div>
    </section>
  </div>
  <div class="hint">vz-hub • Touch controller</div>
</div>

<div id="settings" class="modal">
  <div class="card">
    <h2>vz-hub Settings</h2>
    <div class="fieldRow">
      <div class="field"><label>PC / receiver IP</label><input id="ip-input" inputmode="decimal" placeholder="192.168.1.42"></div>
      <div class="field"><label>Port</label><input id="port-input" inputmode="numeric" value="8848"></div>
    </div>
    <div class="err" id="settingsErr"></div>
    <div class="small" id="modeHint">Use Customize to reposition, resize, and remap the touch controls. The layout is saved on this device.</div>
    <div class="actions"><button id="btn-close-settings">Close</button><button class="primary" id="btn-connect">Connect</button></div>
  </div>
</div>

<div id="custom-panel" class="modal">
  <div class="card">
    <div class="customHead"><div><strong>Adjust Controls</strong><span>Drag any control to move it. Choose an action and size below.</span></div><button class="primary" id="btn-custom-done">Done</button></div>
    <div class="customGrid">
      <label>Selected control<select id="customControl"></select></label>
      <label id="mappingWrap">Button action<select id="customMap"></select></label>
      <label>Size<input id="customSize" type="range" min="65" max="160" value="100"><output id="customSizeValue">100%</output></label>
    </div>
    <div class="customActions"><button id="btn-reset-layout">Reset layout</button><span class="small" style="margin:0">Changes save automatically.</span></div>
  </div>
</div>

<script>
const BTN={DPAD_UP:1,DPAD_DOWN:2,DPAD_LEFT:4,DPAD_RIGHT:8,START:16,BACK:32,L3:64,R3:128,LB:256,RB:512,A:4096,B:8192,X:16384,Y:32768};
const LABEL={DPAD_UP:'D-pad Up',DPAD_DOWN:'D-pad Down',DPAD_LEFT:'D-pad Left',DPAD_RIGHT:'D-pad Right',START:'Start',BACK:'Back',L3:'L3',R3:'R3',LB:'LB',RB:'RB',A:'A',B:'B',X:'X',Y:'Y'};
const ACTIONS={DPAD_UP:'D-pad Up',DPAD_DOWN:'D-pad Down',DPAD_LEFT:'D-pad Left',DPAD_RIGHT:'D-pad Right',START:'Start',BACK:'Back',L3:'L3',R3:'R3',LB:'LB',RB:'RB',A:'A',B:'B',X:'X',Y:'Y'};
const state={b:0,lx:0,ly:0,rx:0,ry:0,lt:0,rt:0};let ws=null,lastSent='',wantConnected=false,reconnectTimer=null,customizing=false,selectedControl=null,layout={};
let buttonAction={"btn-a":"A","btn-b":"B","btn-x":"X","btn-y":"Y","btn-lb":"LB","btn-rb":"RB","btn-l3":"L3","btn-r3":"R3","btn-start":"START","btn-back":"BACK","dpad-up":"DPAD_UP","dpad-down":"DPAD_DOWN","dpad-left":"DPAD_LEFT","dpad-right":"DPAD_RIGHT"};
const layoutIds=['btn-back','btn-start','btn-lb','lt-track','stick-l','btn-l3','dpad-up','dpad-down','dpad-left','dpad-right','btn-rb','rt-track','btn-y','btn-a','btn-x','btn-b','stick-r','btn-r3'];
const names={"btn-back":"Back","btn-start":"Start","btn-lb":"LB","lt-track":"LT","stick-l":"Left Stick","btn-l3":"L3","dpad-up":"D-pad Up","dpad-down":"D-pad Down","dpad-left":"D-pad Left","dpad-right":"D-pad Right","btn-rb":"RB","rt-track":"RT","btn-y":"Y","btn-a":"A","btn-x":"X","btn-b":"B","stick-r":"Right Stick","btn-r3":"R3"};
function vibrate(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function send(){const p=JSON.stringify(state);if(p===lastSent)return;lastSent=p;if(window.AndroidBT&&window.AndroidBT.onState){try{window.AndroidBT.onState(p)}catch(e){}return}if(window.AndroidTV&&window.AndroidTV.onState){try{window.AndroidTV.onState(p)}catch(e){}return}if(ws&&ws.readyState===1){try{ws.send(p)}catch(e){}}}
function setStatus(cls,text){const e=document.getElementById('status');e.className='status '+(cls||'');document.getElementById('statusText').textContent=text}
function actionFlag(id){return BTN[buttonAction[id]]||0}
function setButton(id,on,el){const f=actionFlag(id);if(!f)return;if(on)state.b|=f;else state.b&=~f;if(el)el.classList.toggle('on',on);send()}
function refreshLabels(){Object.keys(buttonAction).forEach(id=>{const e=document.getElementById(id);if(!e)return;if(id.startsWith('dpad-'))return;e.textContent=LABEL[buttonAction[id]]||buttonAction[id]})}
function loadActions(){try{const s=JSON.parse(localStorage.getItem('vz-hub-actions')||'null');if(s)Object.keys(buttonAction).forEach(id=>{if(s[id]&&BTN[s[id]])buttonAction[id]=s[id]})}catch(e){}refreshLabels()}
function saveActions(){try{localStorage.setItem('vz-hub-actions',JSON.stringify(buttonAction))}catch(e){}}
function bindButtons(){Object.keys(buttonAction).forEach(id=>{const e=document.getElementById(id);if(!e)return;e.addEventListener('pointerdown',ev=>{if(customizing)return;ev.preventDefault();e.setPointerCapture(ev.pointerId);setButton(id,true,e);vibrate(10)});const up=ev=>{if(customizing)return;try{e.releasePointerCapture(ev.pointerId)}catch(_){}setButton(id,false,e)};e.addEventListener('pointerup',up);e.addEventListener('pointercancel',up)})}
function bindStick(id,xk,yk){const e=document.getElementById(id),nub=e.querySelector('.nub');let pid=null;function update(ev){const r=e.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.43;let x=ev.clientX-cx,y=ev.clientY-cy,m=Math.hypot(x,y);if(m>max){x=x*max/m;y=y*max/m}state[xk]=+(x/max).toFixed(3);state[yk]=+(-y/max).toFixed(3);nub.style.left='calc(50% + '+state[xk]*38+'%)';nub.style.top='calc(50% - '+state[yk]*38+'%)';send()}function end(){pid=null;e.classList.remove('on');nub.style.left='50%';nub.style.top='50%';state[xk]=0;state[yk]=0;send()}e.addEventListener('pointerdown',ev=>{if(customizing)return;pid=ev.pointerId;e.setPointerCapture(pid);e.classList.add('on');update(ev)});e.addEventListener('pointermove',ev=>{if(!customizing&&ev.pointerId===pid)update(ev)});e.addEventListener('pointerup',end);e.addEventListener('pointercancel',end)}
function bindTrigger(id,key,fillId){const e=document.getElementById(id),fill=document.getElementById(fillId);let pid=null;function update(ev){const r=e.getBoundingClientRect(),v=Math.max(0,Math.min(1,(r.bottom-ev.clientY)/r.height));state[key]=+v.toFixed(3);fill.style.height=v*100+'%';send()}function end(){pid=null;state[key]=0;fill.style.height='0%';send()}e.addEventListener('pointerdown',ev=>{if(customizing)return;pid=ev.pointerId;e.setPointerCapture(pid);update(ev)});e.addEventListener('pointermove',ev=>{if(!customizing&&ev.pointerId===pid)update(ev)});e.addEventListener('pointerup',end);e.addEventListener('pointercancel',end)}
function loadLayout(){try{layout=JSON.parse(localStorage.getItem('vz-hub-layout')||'{}')||{}}catch(e){layout={}}layoutIds.forEach(id=>{if(!layout[id])layout[id]={x:0,y:0,s:1};applyLayout(id)})}
function saveLayout(){try{localStorage.setItem('vz-hub-layout',JSON.stringify(layout))}catch(e){}}
function applyLayout(id){const e=document.getElementById(id);if(!e)return;const v=layout[id]||{x:0,y:0,s:1};e.classList.add('layoutTarget');e.style.transform='translate('+v.x+'px,'+v.y+'px) scale('+v.s+')'}
function buildCustom(){const s=document.getElementById('customControl'),m=document.getElementById('customMap');layoutIds.forEach(id=>{const o=document.createElement('option');o.value=id;o.textContent=names[id];s.appendChild(o)});Object.keys(ACTIONS).forEach(a=>{const o=document.createElement('option');o.value=a;o.textContent=ACTIONS[a];m.appendChild(o)});s.onchange=()=>selectControl(s.value);m.onchange=()=>{if(selectedControl&&buttonAction[selectedControl]){buttonAction[selectedControl]=m.value;saveActions();refreshLabels()}};document.getElementById('customSize').oninput=function(){if(!selectedControl)return;layout[selectedControl].s=+this.value/100;applyLayout(selectedControl);document.getElementById('customSizeValue').textContent=this.value+'%';saveLayout()}}
function selectControl(id){selectedControl=id||layoutIds[0];document.querySelectorAll('.layoutTarget.selected').forEach(e=>e.classList.remove('selected'));const e=document.getElementById(selectedControl);if(e)e.classList.add('selected');document.getElementById('customControl').value=selectedControl;const wrap=document.getElementById('mappingWrap');if(buttonAction[selectedControl]){wrap.style.display='flex';document.getElementById('customMap').value=buttonAction[selectedControl]}else wrap.style.display='none';const p=Math.round((layout[selectedControl]||{s:1}).s*100);document.getElementById('customSize').value=p;document.getElementById('customSizeValue').textContent=p+'%'}
function enterCustomize(){customizing=true;document.body.classList.add('customizing');document.getElementById('custom-panel').classList.add('open');document.getElementById('btn-customize').classList.add('active');layoutIds.forEach(id=>{const e=document.getElementById(id);if(!e)return;e.onpointerdown=ev=>{ev.preventDefault();selectControl(id);e.setPointerCapture(ev.pointerId);e.dataset.x=ev.clientX;e.dataset.y=ev.clientY};e.onpointermove=ev=>{if(!e.hasPointerCapture(ev.pointerId))return;const x=ev.clientX-(+e.dataset.x||ev.clientX),y=ev.clientY-(+e.dataset.y||ev.clientY);if(x||y){layout[id].x+=x;layout[id].y+=y;e.dataset.x=ev.clientX;e.dataset.y=ev.clientY;applyLayout(id);saveLayout()}};e.onpointerup=e.onpointercancel=ev=>{try{e.releasePointerCapture(ev.pointerId)}catch(_){}}});selectControl(selectedControl||layoutIds[0])}
function exitCustomize(){customizing=false;document.body.classList.remove('customizing');document.getElementById('custom-panel').classList.remove('open');document.getElementById('btn-customize').classList.remove('active');document.querySelectorAll('.layoutTarget.selected').forEach(e=>e.classList.remove('selected'))}
function resetLayout(){layout={};loadLayout();saveLayout();selectControl(selectedControl||layoutIds[0])}
function wsUrl(){const ip=document.getElementById('ip-input').value.trim(),port=document.getElementById('port-input').value.trim()||'8848';return 'ws://'+ip+':'+port+'/ws'}
function connect(){const ip=document.getElementById('ip-input').value.trim();if(!ip){document.getElementById('settingsErr').textContent='Enter the receiver IP address.';return}try{localStorage.setItem('pad-ip',ip);localStorage.setItem('pad-port',document.getElementById('port-input').value.trim()||'8848')}catch(e){}wantConnected=true;setStatus('connecting','Connecting…');try{ws&&ws.close()}catch(e){}ws=new WebSocket(wsUrl());ws.onopen=()=>{setStatus('connected','Connected');document.getElementById('settings').classList.remove('open');lastSent='';send()};ws.onclose=()=>{setStatus('','Disconnected');if(wantConnected){clearTimeout(reconnectTimer);reconnectTimer=setTimeout(()=>{reconnectTimer=null;if(wantConnected)connect()},3000)}};ws.onerror=()=>{document.getElementById('settingsErr').textContent='Could not reach that address.'}}
function disconnect(){wantConnected=false;clearTimeout(reconnectTimer);try{ws&&ws.close()}catch(e){}setStatus('','Disconnected')}
document.getElementById('gear').onclick=()=>document.getElementById('settings').classList.add('open');
document.getElementById('btn-close-settings').onclick=()=>document.getElementById('settings').classList.remove('open');
document.getElementById('btn-connect').onclick=()=>{if(ws&&ws.readyState===1)disconnect();else connect()};
document.getElementById('btn-customize').onclick=()=>customizing?exitCustomize():enterCustomize();
document.getElementById('btn-custom-done').onclick=exitCustomize;
document.getElementById('btn-reset-layout').onclick=resetLayout;
window.__onNativeStatus=(txt,cls)=>setStatus(cls||'',txt);
(function init(){loadActions();buildCustom();loadLayout();bindButtons();bindStick('stick-l','lx','ly');bindStick('stick-r','rx','ry');bindTrigger('lt-track','lt','lt-fill');bindTrigger('rt-track','rt','rt-fill');try{const ip=localStorage.getItem('pad-ip');const port=localStorage.getItem('pad-port');if(ip){document.getElementById('ip-input').value=ip;document.getElementById('port-input').value=port||'8848'}}catch(e){}if(window.AndroidBT||window.AndroidTV){document.getElementById('btn-connect').style.display='none';document.getElementById('modeHint').textContent=window.AndroidBT?'Bluetooth mode: pair "vz-hub" from the host Bluetooth settings.':'Android TV mode: enable the vz-hub input method on the TV.';}else if(document.getElementById('ip-input').value){setTimeout(connect,250)}else document.getElementById('settings').classList.add('open');setTimeout(()=>{const s=document.getElementById('vzSplash');s.classList.add('hide');setTimeout(()=>s.style.display='none',500)},1400)})();
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body></html>
